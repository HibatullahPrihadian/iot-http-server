server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Resolver Docker internal + upstream variabel, agar nginx TIDAK gagal start
    # saat container target belum siap (hindari restart-loop).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $iot_api http://iot-api:3000;
    set $hidro_backend http://hidro-backend:5000;
    set $nodered http://nodered:1880;

    # Izinkan upload gambar sampai batas Settings (maxImageMb maks 20MB + overhead multipart).
    client_max_body_size 21m;

    # Kompresi gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # Cache aset statis hashed /assets/
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # --- PWA ---
    # mime.types bawaan nginx tidak memetakan .webmanifest, jadi set manual
    # (kalau tidak, manifest terkirim sebagai application/octet-stream).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Service worker wajib selalu divalidasi ulang agar versi baru cepat terdeteksi.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # --- Ingest sensor (Node-RED) ---
    # Wajib: tanpa route ini POST /terima-sensor jatuh ke SPA fallback dan gagal.
    location = /terima-sensor {
        proxy_pass $nodered;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API IoT (ex nodejs-web:3000) ---
    # Path spesifik menang atas prefix /api/ di bawah (nginx longest-prefix match).
    location = /api/sensor-data {
        proxy_pass $iot_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/pompa/ {
        proxy_pass $iot_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/interval/ {
        proxy_pass $iot_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/autodosing/ {
        proxy_pass $iot_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/relay/ {
        proxy_pass $iot_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route perangkat (polling perintah + ACK). Harus sebelum prefix /api/.
    location /api/device/ {
        proxy_pass $iot_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ingest data listrik PZEM-004T (langsung ke iot-api, bukan Node-RED).
    # Harus sebelum prefix /api/ agar tidak jatuh ke hidro-backend.
    location /api/listrik/ {
        proxy_pass $iot_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API Plan (hidro-backend:5000) ---
    location /api/ {
        proxy_pass $hidro_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy gambar batch (/uploads/<file>) ke backend Plan, agar satu origin dengan UI.
    location /uploads/ {
        proxy_pass $hidro_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (index.html no-cache), untuk semua route react-router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
